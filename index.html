<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daara Jazbul Qulub</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="logo.jpeg" alt="Logo Daara Jazbul Qulub" onerror="this.style.display='none'">
    <div><strong>Daara Jazbul Qulub</strong><small>Espace membre</small></div>
  </div>
  <button id="logoutBtn" class="danger hidden">Déconnexion</button>
</header>

<main class="container">
  <section id="loginSection" class="panel">
    <h1>Connexion administrateur</h1>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required></label>
      <label>Mot de passe<input id="password" type="password" required></label>
      <button class="primary">Se connecter</button>
    </form>
    <p id="loginMsg" class="msg"></p>
  </section>

  <section id="appSection" class="hidden">
    <div class="hero">
      <img src="logo.jpeg" alt="Logo" class="heroLogo" onerror="this.style.display='none'">
      <div><h1>Gestion des membres</h1><p>Daara Jazbul Qulub</p></div>
    </div>

    <div class="stats">
      <div><b id="activeCount">0</b><span>Membres actifs</span></div>
      <div><b id="totalCount">0</b><span>Total membres</span></div>
    </div>

    <section class="panel">
      <h2 id="formTitle">Ajouter un membre</h2>
      <form id="memberForm">
        <input id="memberId" type="hidden">
        <div class="grid">
          <label>Prénom<input id="firstName" required></label>
          <label>Nom<input id="lastName" required></label>
          <label>Téléphone<input id="phone"></label>
          <label>Email<input id="memberEmail" type="email"></label>
          <label>Statut
            <select id="status"><option value="active">Actif</option><option value="inactive">Inactif</option></select>
          </label>
          <label>Photo du membre
            <input id="photo" type="file" accept="image/jpeg,image/png,image/webp">
          </label>
        </div>
        <div id="photoPreviewWrap" class="photoPreview hidden">
          <img id="photoPreview" alt="Aperçu de la photo">
        </div>
        <div class="actions">
          <button class="primary" id="saveBtn">Enregistrer</button>
          <button type="button" class="secondary hidden" id="cancelEdit">Annuler la modification</button>
        </div>
        <p id="formMsg" class="msg"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Liste des membres</h2>
      <div id="membersList"></div>
    </section>
  </section>
</main>

<div id="cardModal" class="modal hidden">
  <div class="modalBox">
    <button id="closeModal" class="close">×</button>
    <div id="cardArea"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
