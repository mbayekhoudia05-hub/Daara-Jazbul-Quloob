name: Mobile build

on:
  push:
    branches:
      - mobile-app-foundation-2026-11-15
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install dependencies
        run: npm install
      - name: Validate web app and PWA files
        run: |
          node --check app.js
          node --check sw.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); const has=(size,file)=>m.icons?.some(i=>i.sizes===size && i.type==='image/png' && fs.existsSync(file)); if(!m.name || !m.start_url || !m.scope || m.display!=='standalone' || !has('192x192','pwa-icon-192.png') || !has('512x512','pwa-icon-512.png') || !m.icons?.some(i=>i.type==='image/svg+xml' && i.sizes==='any' && fs.existsSync('pwa-icon.svg'))) process.exit(1); for (const f of ['index.html','installation.html']) { const h=fs.readFileSync(f,'utf8'); if(!h.includes('manifest.webmanifest') || !h.includes('pwa-icon-180.png')) process.exit(1); } if(!fs.existsSync('pwa-icon-180.png')) process.exit(1); console.log('PWA manifest, 180/192/512 icons and linked pages are valid.');"
      - name: Prepare web assets
        run: npm run build:mobile
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daara-jazbul-quluub-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build:mobile
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Build for iOS Simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          mkdir -p build/ios
          APP_PATH='build/DerivedData/Build/Products/Debug-iphonesimulator/App.app'
          test -n "$APP_PATH"
          ditto "$APP_PATH" build/ios/DaaraJazbulQuluub.app
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: daara-jazbul-quluub-ios-simulator
          path: build/ios/DaaraJazbulQuluub.app
          if-no-files-found: error
